<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="description" content="Gym App: Trainings erfassen, Fortschritt verfolgen, Routinen planen.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gym App">
  <title>Gym App</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="nav" aria-label="Hauptnavigation">
    <div class="brand">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M7 7v10M17 7v10M3.5 9.500v5M20.5 9.500v5M7 12h10"/></svg>
      Gym App
    </div>
    <a href="#/home" data-tab="home">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Start</span>
    </a>
    <a href="#/history" data-tab="history">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Verlauf</span>
    </a>
    <a href="#/workout" data-tab="workout" class="cta">
      <span class="bubble"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
      <span>Training</span>
    </a>
    <a href="#/progress" data-tab="progress">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"/><path d="M4 16l5-6 4 3 7-8"/></svg>
      <span>Fortschritt</span>
    </a>
    <a href="#/more" data-tab="more">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>
      <span>Mehr</span>
    </a>
  </nav>

  <main id="view"></main>

  <div id="rest-bar" hidden role="status" aria-label="Pausentimer"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="chart-tip" class="chart-tip" hidden></div>

  <noscript><p style="padding:24px">Die Gym App braucht JavaScript.</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views-workout.js"></script>
  <script src="js/views-progress.js"></script>
  <script src="js/views-more.js"></script>
  <script src="js/views-plan.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
